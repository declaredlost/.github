name: Bug report
description: Something isn't working as intended
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include logs, screenshots or clips if you have them.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit you found the bug in.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser or hardware, where relevant.
      placeholder: e.g. macOS 26, Windows 11, Firefox 150
