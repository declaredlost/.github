name: Feature request
description: Request a new feature
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Implementation ideas are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem you considered.
